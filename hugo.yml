module:
  mounts:
    - source: assets
      target: assets
    - source: content
      target: content
    - source: i18n
      target: i18n
    - source: layouts
      target: layouts

# Admin
params:
  admin:
    collections:
      jobs_categories:
        enable: true
        filter:
          - field: isIndex
            value: false
        icon:
          bootstrap_icons: bookmarks
          iconoir: bookmarks
          material_icons: bookmarks
          material_symbols: bookmarks
          lucide: bookmark
          sveltiacms: bookmarks # legacy

# Permalink
permalinks:
  taxonomy:
    jobs_categories: /jobs/categories/
  term:
    jobs_categories: /jobs/categories/:slug/

# Set taxonomy
taxonomies:
  jobs_category: jobs_categories
